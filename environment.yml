name: physical-ai

channels:
  - defaults

dependencies:
  - python=3.12

  # All remaining packages are installed via pip.
  # NOTE: Install PyTorch CPU-only BEFORE creating from this file:
  #   pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
  # This file mirrors requirements.txt but does NOT include torch — install torch first.
  - pip:
    - numpy==2.2.4
    - mujoco>=3.1,<4.0
    - gymnasium[classic_control,mujoco]==1.3.0
    - stable-baselines3==2.9.0
    - opencv-python==4.13.0.92
    - mediapipe==1.0.0
    - cvzone
    - google-genai
    - huggingface_hub
    - huggingface_sb3
    - Pillow
    - matplotlib
    - ipykernel
    - imageio[ffmpeg]
    - python-dotenv
